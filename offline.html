<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7fbff"><meta name="robots" content="noindex"><title>Sem conexão • Diamond Game</title><link rel="icon" href="./State.ico"><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100dvh;overflow:hidden;background:#f7fbff;color:#07111f}.offline{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(circle at 50% 42%,#fff 0 28%,#edf7ff 60%,#dcecff 100%)}.code{position:absolute;z-index:0;inset:50% 0 auto;transform:translateY(-78%);font-size:clamp(9rem,31vw,23rem);font-weight:900;line-height:.72;letter-spacing:-.08em;color:rgba(71,111,163,.18);user-select:none}.inner{position:relative;z-index:1;width:min(100%,720px)}.diamond{font-size:clamp(7rem,24vw,13rem);line-height:1;color:#0875ff;text-shadow:-12px 10px 0 #0045b8,12px 4px 0 #45c9ff,0 0 25px #00a8ff;filter:drop-shadow(0 24px 28px rgba(0,89,255,.22));animation:float 5s ease-in-out infinite}.offline h1{margin:.2rem 0 0;font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.055em}.offline h1 span{color:#0875ff}.offline p{margin:.55rem auto 1.5rem;max-width:520px;color:#536170;line-height:1.55}.offline button{min-height:56px;padding:.85rem 1.5rem;border:0;border-radius:999px;background:linear-gradient(100deg,#063cc9,#0577ff 58%,#00c8ff);color:#fff;font-weight:800;font-size:.95rem;box-shadow:0 14px 35px rgba(0,105,255,.3);cursor:pointer}.status{display:block;margin-top:1rem;font-size:.72rem;font-weight:700;letter-spacing:.08em;color:#748497}.brand{position:fixed;z-index:2;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:800;letter-spacing:.22em;color:#6d7e91}@keyframes float{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.diamond{animation:none}}</style></head><body><span class="brand">DIAMOND GAME</span><main class="offline"><div class="code" aria-hidden="true">OFF</div><div class="inner"><div class="diamond" aria-hidden="true">◆</div><h1>Você está <span>sem internet.</span></h1><p>Não foi possível conectar ao Diamond Game. Verifique sua conexão e tente novamente.</p><button type="button" onclick="location.reload()">Tentar novamente →</button><small class="status">AGUARDANDO CONEXÃO</small></div></main><script>addEventListener("online",()=>location.reload())</script></body></html>
