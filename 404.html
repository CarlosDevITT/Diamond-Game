<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7fbff">
  <meta name="robots" content="noindex">
  <title>404 • Diamond Game</title>
  <link rel="icon" href="./State.ico">
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}body{min-height:100dvh;overflow:hidden;background:#f7fbff;color:#07111f}
    .error{position:relative;min-height:100dvh;display:grid;place-items:center;padding:24px;isolation:isolate;background:radial-gradient(circle at 50% 42%,#fff 0 28%,#edf7ff 60%,#dcecff 100%)}
    .error:before,.error:after{content:"";position:absolute;width:34vw;height:34vw;border-radius:50%;filter:blur(55px);opacity:.32;z-index:-2;background:#168cff}.error:before{left:-18vw;top:22%}.error:after{right:-18vw;bottom:10%}
    .error__inner{width:min(100%,980px);text-align:center;position:relative}.error__code{position:absolute;z-index:-1;inset:50% 0 auto;transform:translateY(-70%);font-size:clamp(15rem,43vw,32rem);font-weight:900;line-height:.72;letter-spacing:-.09em;color:rgba(71,111,163,.23);text-shadow:0 0 35px rgba(255,255,255,.9);user-select:none}
    .diamond{position:relative;width:min(48vw,310px);aspect-ratio:1;margin:0 auto -18px;filter:drop-shadow(0 24px 28px rgba(0,89,255,.22));animation:float 5s ease-in-out infinite}.diamond:before{content:"◆";position:absolute;inset:0;display:grid;place-items:center;font-size:min(40vw,260px);line-height:1;color:#0875ff;text-shadow:-18px 12px 0 #0045b8,18px 5px 0 #45c9ff,0 0 25px #00a8ff;transform:rotate(-4deg)}.diamond:after{content:"";position:absolute;left:12%;right:12%;bottom:13%;height:16%;border-radius:50%;background:#178cff;filter:blur(30px);opacity:.42;z-index:-1}
    .error h1{margin:0;font-size:clamp(2rem,5vw,3.3rem);letter-spacing:-.055em}.error h1 span{color:#0875ff}.error p{margin:.55rem auto 1.6rem;max-width:540px;color:#536170;font-size:clamp(.9rem,2.2vw,1.1rem)}
    .error a{display:inline-flex;align-items:center;justify-content:center;gap:1rem;min-height:58px;padding:.9rem 1.5rem;border-radius:999px;background:linear-gradient(100deg,#063cc9,#0577ff 58%,#00c8ff);color:#fff;text-decoration:none;font-weight:800;box-shadow:0 14px 35px rgba(0,105,255,.34);transition:transform .2s ease,box-shadow .2s ease}.error a:before{content:"⌂";font-size:1.35rem}.error a span{font-size:1.3rem}.error a:active{transform:scale(.98)}
    .brand{position:fixed;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);font-size:.65rem;font-weight:800;letter-spacing:.22em;color:#6d7e91}
    @keyframes float{50%{transform:translateY(-8px) rotate(1deg)}}@media(hover:hover){.error a:hover{transform:translateY(-3px);box-shadow:0 19px 42px rgba(0,105,255,.4)}}@media(max-width:600px){.error{padding:18px}.error__code{font-size:55vw;transform:translateY(-90%)}.diamond{width:min(58vw,230px);margin-bottom:-8px}.diamond:before{font-size:min(49vw,200px)}.error h1{font-size:2rem}.error p{font-size:.9rem;line-height:1.5}.error a{width:min(100%,330px);min-height:54px;font-size:.86rem}}@media(prefers-reduced-motion:reduce){.diamond{animation:none}}
  </style>
</head>
<body>
  <span class="brand">DIAMOND GAME</span>
  <main class="error">
    <div class="error__inner">
      <div class="error__code" aria-hidden="true">404</div>
      <div class="diamond" aria-hidden="true"></div>
      <h1>Opsss... <span>algo saiu errado.</span></h1>
      <p>A página que você tentou acessar não está mais por aqui.</p>
      <a href="./">Voltar para a página inicial <span>→</span></a>
    </div>
  </main>
</body>
</html>
